<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Buzz In! — Springfield Trivia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --yellow:#FBD130;
    --yellow-deep:#F4B400;
    --sky:#3A9BDC;
    --sky-deep:#1F6FA8;
    --krusty:#E0393E;
    --ink:#0F1226;
    --cream:#FFF7DE;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 40%),
      linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 60%, #123a56 100%);
    color:var(--ink);
    overflow:hidden;
    transition:background-color .15s ease;
  }
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:50%;
    opacity:.85;
    filter:blur(.5px);
  }
  .scene{
    position:relative;
    width:100%;
    max-width:520px;
    padding:28px 20px 40px;
    text-align:center;
  }
  h1{
    font-family:'Luckiest Guy',cursive;
    font-size:clamp(2.1rem,9vw,3.1rem);
    color:var(--yellow);
    -webkit-text-stroke:3px var(--ink);
    text-stroke:3px var(--ink);
    letter-spacing:1px;
    margin:0 0 4px;
    line-height:1;
  }
  .sub{
    color:#eaf6ff;
    font-weight:700;
    margin:0 0 28px;
    font-size:1rem;
    opacity:.9;
  }

  /* ---- name entry ---- */
  #nameCard{
    background:var(--cream);
    border:4px solid var(--ink);
    border-radius:18px;
    padding:26px 22px;
    box-shadow:0 10px 0 rgba(0,0,0,.25);
  }
  #nameCard label{
    display:block;
    font-weight:800;
    margin-bottom:10px;
    font-size:1.05rem;
  }
  #nameInput{
    width:100%;
    padding:14px 16px;
    font-size:1.1rem;
    font-family:inherit;
    font-weight:700;
    border:3px solid var(--ink);
    border-radius:10px;
    outline:none;
    text-align:center;
  }
  #nameInput:focus{border-color:var(--sky-deep);}
  #joinBtn{
    margin-top:16px;
    width:100%;
    padding:14px;
    font-family:'Luckiest Guy',cursive;
    font-size:1.3rem;
    letter-spacing:.5px;
    color:var(--ink);
    background:var(--yellow);
    border:3px solid var(--ink);
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--yellow-deep);
  }
  #joinBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--yellow-deep);}

  /* ---- buzzer screen ---- */
  #buzzScreen{display:none;}
  #playerName{
    font-weight:800;
    font-size:1.15rem;
    color:#fff;
    margin-bottom:22px;
  }
  #playerName span{color:var(--yellow);}

  .buzzer-wrap{
    position:relative;
    width:min(72vw,300px);
    height:min(72vw,300px);
    margin:0 auto 26px;
  }
  #buzzBtn{
    width:100%;
    height:100%;
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 35% 30%, #ff6b63, var(--krusty) 60%, #a91e22 100%);
    box-shadow:
      0 14px 0 #7e1417,
      0 18px 24px rgba(0,0,0,.45),
      inset 0 -10px 20px rgba(0,0,0,.25);
    color:#fff;
    font-family:'Luckiest Guy',cursive;
    font-size:clamp(1.6rem,7vw,2.2rem);
    letter-spacing:1px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    transition:transform .04s ease, box-shadow .04s ease, filter .15s ease;
  }
  #buzzBtn:active:not(:disabled){
    transform:translateY(10px);
    box-shadow:0 4px 0 #7e1417, 0 6px 10px rgba(0,0,0,.35), inset 0 -6px 14px rgba(0,0,0,.3);
  }
  #buzzBtn:disabled{
    filter:grayscale(.55) brightness(.75);
    cursor:not-allowed;
  }
  .ring{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    border:6px solid var(--yellow);
    opacity:.9;
  }

  #status{
    min-height:1.6em;
    font-weight:800;
    font-size:1.05rem;
    color:#fff;
    background:rgba(0,0,0,.28);
    border-radius:10px;
    padding:10px 14px;
    display:inline-block;
  }
  #status.hot{color:#e9ffe0;}
  #status.won{color:#123a12;background:#8ff08a;}
  #status.lost{color:#fff;background:#7a2226;}

  body.flash-win{background-color:#8ff08a !important;}
  body.flash-lost{background-color:#a91e22 !important;}

  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.045);}
  }
  .pulsing{animation:pulse 1.1s ease-in-out infinite;}

  details#roomBox{
    margin-top:26px;
    color:#eaf6ff;
    font-size:.8rem;
  }
  details#roomBox summary{cursor:pointer;opacity:.75;}
  #roomInput{
    margin-top:8px;
    padding:8px 10px;
    border-radius:8px;
    border:2px solid #fff;
    font-family:inherit;
    text-align:center;
    width:70%;
  }
  #roomSaveBtn{
    margin-left:6px;
    padding:8px 12px;
    border-radius:8px;
    border:2px solid #fff;
    background:var(--yellow);
    font-weight:800;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="scene">
  <h1>Buzz In!</h1>
  <p class="sub">Springfield Trivia Gameshow</p>

  <div id="nameCard">
    <label for="nameInput">What's your name, contestant?</label>
    <input id="nameInput" type="text" maxlength="20" placeholder="e.g. Barney">
    <button id="joinBtn">Take Your Seat</button>
  </div>

  <div id="buzzScreen">
    <p id="playerName">Playing as <span id="playerNameText"></span></p>
    <div class="buzzer-wrap">
      <div class="ring"></div>
      <button id="buzzBtn">BUZZ</button>
    </div>
    <div id="status" class="hot">Buzzers are hot — go!</div>

    <details id="roomBox">
      <summary>Joining the wrong game? Change room code</summary>
      <div>
        <input id="roomInput" type="text" maxlength="24">
        <button id="roomSaveBtn">Save &amp; rejoin</button>
      </div>
    </details>
  </div>
</div>

<script>
/* =========================================================
   1) FIREBASE SETUP — replace with YOUR project's config.
   Create a free project at https://console.firebase.google.com
   → Build → Realtime Database → Create Database → test mode.
   Then Project settings → your app's config object → paste below.
   ========================================================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ---- room handling ---- */
const DEFAULT_ROOM = "simpsons-trivia";
let roomCode = localStorage.getItem("buzzerRoom") || DEFAULT_ROOM;
document.getElementById("roomInput").value = roomCode;
let winnerRef = db.ref("rooms/" + roomCode + "/winner");

document.getElementById("roomSaveBtn").addEventListener("click", () => {
  const val = document.getElementById("roomInput").value.trim() || DEFAULT_ROOM;
  localStorage.setItem("buzzerRoom", val);
  location.reload();
});

/* ---- name entry ---- */
const nameCard = document.getElementById("nameCard");
const buzzScreen = document.getElementById("buzzScreen");
const nameInput = document.getElementById("nameInput");
const joinBtn = document.getElementById("joinBtn");
const playerNameText = document.getElementById("playerNameText");

let playerName = sessionStorage.getItem("buzzerPlayerName") || "";

function showBuzzScreen(){
  nameCard.style.display = "none";
  buzzScreen.style.display = "block";
  playerNameText.textContent = playerName;
}

if (playerName) showBuzzScreen();

joinBtn.addEventListener("click", joinGame);
nameInput.addEventListener("keydown", e => { if (e.key === "Enter") joinGame(); });

function joinGame(){
  const v = nameInput.value.trim();
  if (!v) { nameInput.focus(); return; }
  playerName = v.slice(0, 20);
  sessionStorage.setItem("buzzerPlayerName", playerName);
  showBuzzScreen();
}

/* ---- sound (no external files — synthesized) ---- */
let audioCtx;
function ctx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playWinSound(){
  const c = ctx();
  const t = c.currentTime;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(880, t);
  o.frequency.exponentialRampToValueAtTime(440, t + 0.35);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + 0.4);
}
function playLoseSound(){
  const c = ctx();
  const t = c.currentTime;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = "square";
  o.frequency.setValueAtTime(160, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 0.3);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + 0.32);
}

/* ---- buzzer logic ---- */
const buzzBtn = document.getElementById("buzzBtn");
const statusEl = document.getElementById("status");
let iAmLockedOut = false;

buzzBtn.addEventListener("click", () => {
  ctx(); // unlock audio on user gesture
  if (buzzBtn.disabled) return;
  buzzBtn.disabled = true;

  winnerRef.transaction(current => {
    if (current === null || current === undefined) {
      return { name: playerName, ts: Date.now() };
    }
    return; // someone already got there — abort, don't overwrite
  }, (error, committed, snapshot) => {
    if (error) { buzzBtn.disabled = false; return; }
    const val = snapshot ? snapshot.val() : null;
    if (committed && val && val.name === playerName) {
      playWinSound();
      document.body.classList.add("flash-win");
      statusEl.className = "won";
      statusEl.textContent = "🎉 You buzzed in first!";
    } else {
      playLoseSound();
      document.body.classList.add("flash-lost");
      setTimeout(() => document.body.classList.remove("flash-lost"), 220);
    }
  });
});

winnerRef.on("value", snap => {
  const val = snap.val();
  buzzBtn.classList.remove("pulsing");
  document.body.classList.remove("flash-win");

  if (val && val.name) {
    buzzBtn.disabled = true;
    if (val.name === playerName) {
      statusEl.className = "won";
      statusEl.textContent = "🎉 You buzzed in first!";
    } else {
      statusEl.className = "lost";
      statusEl.textContent = val.name + " buzzed in first!";
    }
  } else {
    buzzBtn.disabled = false;
    buzzBtn.classList.add("pulsing");
    statusEl.className = "hot";
    statusEl.textContent = "Buzzers are hot — go!";
  }
});
</script>
</body>
</html>
