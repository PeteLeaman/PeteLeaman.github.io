<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>House Rules — Control Panel</title>
<style>
  :root{
    --bg: #14100d;
    --panel: #201a15;
    --panel-raised: #2a2119;
    --border: #4a3a26;
    --gold: #d4a73a;
    --gold-dim: #8a7038;
    --cream: #f2e8d5;
    --cream-dim: #b8ac95;
    --green: #4a8b5c;
    --green-dark: #33613f;
    --red: #b23a3a;
    --red-dark: #7d2828;
    --shadow: rgba(0,0,0,0.5);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Arial Narrow', Arial, Helvetica, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }

  body{ padding: 14px 14px 40px; }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom: 3px solid var(--gold);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }

  h1{
    margin:0;
    font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    letter-spacing: 1px;
    font-size: 30px;
    color: var(--gold);
    text-shadow: 2px 2px 0 var(--shadow);
  }

  h1 span{ color: var(--cream); }

  /* ===== SHOW TIMER BAR ===== */
  .timer-bar{
    display:flex;
    align-items:center;
    gap:16px;
    background: var(--panel);
    border: 1px solid var(--gold-dim);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .timer-readout{
    display:flex;
    align-items:baseline;
    gap: 10px;
  }

  .timer-elapsed{
    font-family: Impact, Haettenschweiler, sans-serif;
    font-size: 40px;
    color: var(--gold);
    text-shadow: 2px 2px 0 var(--shadow);
    line-height: 1;
  }

  .timer-remaining{
    font-size: 15px;
    font-weight: bold;
    color: var(--cream-dim);
  }

  .timer-remaining.warn{ color: #e0b84a; }
  .timer-remaining.over{ color: #d97a7a; }

  .timer-target{
    display:flex;
    align-items:center;
    gap:6px;
    font-size: 12px;
    color: var(--cream-dim);
  }

  .timer-target input{
    width: 52px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--cream);
    border-radius: 6px;
    padding: 6px;
    font-size: 14px;
    text-align:center;
  }

  .timer-buttons{
    display:flex;
    gap:10px;
    margin-left: auto;
  }

  .timer-btn{
    font-family: Impact, Haettenschweiler, sans-serif;
    letter-spacing: 1px;
    font-size: 17px;
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    color: var(--cream);
    min-height: 48px;
  }

  .timer-btn.go{ background: var(--green); border-bottom: 4px solid var(--green-dark); }
  .timer-btn.pause{ background: var(--gold); color: #2a2119; border-bottom: 4px solid var(--gold-dim); }
  .timer-btn:active{ transform: translateY(2px); border-bottom-width: 2px; }

  .timer-reset-btn{
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--cream-dim);
    font-size: 13px;
    padding: 12px 14px;
    border-radius: 8px;
    min-height: 48px;
  }

  /* ===== SCENE BAR ===== */
  .scene-bar{
    display:flex;
    align-items:center;
    gap:12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .scene-status{
    flex:1;
    min-width: 160px;
  }

  .scene-status .label{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--cream-dim);
  }

  .scene-status .value{
    font-size: 20px;
    font-weight: bold;
    color: var(--gold);
  }

  .scene-btn{
    font-family: Impact, Haettenschweiler, sans-serif;
    letter-spacing: 1px;
    font-size: 20px;
    padding: 14px 26px;
    border-radius: 8px;
    border: none;
    color: var(--cream);
    min-height: 54px;
  }

  .scene-btn.start{ background: var(--green); border-bottom: 4px solid var(--green-dark); }
  .scene-btn.end{ background: var(--red); border-bottom: 4px solid var(--red-dark); }
  .scene-btn:active{ transform: translateY(2px); border-bottom-width: 2px; }

  /* ===== COUNTERS ===== */
  .counters{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }

  @media (min-width: 820px){
    .counters{ grid-template-columns: repeat(4, 1fr); }
  }

  .counter-card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align:center;
    position: relative;
    overflow: hidden;
  }

  .counter-card .name{
    font-size: 17px;
    font-weight: bold;
    letter-spacing: 0.5px;
    color: var(--cream);
    margin-bottom: 4px;
  }

  .counter-card .delta{
    font-size: 13px;
    height: 16px;
    color: var(--gold);
    margin-bottom: 4px;
    font-weight: bold;
  }

  .counter-card .score{
    font-family: Impact, Haettenschweiler, sans-serif;
    font-size: 56px;
    line-height: 1;
    color: var(--gold);
    margin: 6px 0 12px;
    text-shadow: 2px 2px 0 var(--shadow);
  }

  .counter-card .score.negative{ color: #d97a7a; }

  .btn-row{
    display:flex;
    gap: 10px;
  }

  .pm-btn{
    flex:1;
    min-height: 62px;
    border-radius: 10px;
    border:none;
    font-size: 30px;
    font-weight: bold;
    color: var(--cream);
    line-height: 1;
  }

  .pm-btn.minus{ background: var(--red); border-bottom: 4px solid var(--red-dark); }
  .pm-btn.plus{ background: var(--green); border-bottom: 4px solid var(--green-dark); }
  .pm-btn:active{ transform: translateY(2px); border-bottom-width: 2px; }

  .flash{
    animation: flash-anim 0.4s ease-out;
  }
  @keyframes flash-anim{
    0%{ background: var(--gold-dim); }
    100%{ background: transparent; }
  }

  /* ===== SCENE LOG ===== */
  .scene-log{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 18px;
  }

  .scene-log h2{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--cream-dim);
    margin: 0 0 8px;
  }

  .scene-log-entry{
    font-size: 14px;
    border-top: 1px solid var(--border);
    padding: 6px 0;
    color: var(--cream-dim);
  }

  .scene-log-entry:first-of-type{ border-top:none; }

  .scene-log-entry b{ color: var(--cream); }

  .empty-note{ color: var(--cream-dim); font-size: 13px; font-style: italic; }

  /* ===== NOTES / CHECKLIST ===== */
  .notes-section{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }

  .notes-section h2{
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gold);
    margin: 0 0 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  .add-row{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .add-row select{
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--cream);
    border-radius: 8px;
    padding: 0 10px;
    font-size: 15px;
  }

  .add-row input[type="text"]{
    flex:1;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--cream);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    -webkit-user-select: text;
    user-select: text;
  }

  .add-row button{
    background: var(--gold);
    color: #2a2119;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-weight: bold;
    font-size: 15px;
  }

  .checklist{
    list-style: none;
    margin:0; padding:0;
  }

  .checklist li{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    padding: 10px 4px;
    border-top: 1px solid var(--border);
  }

  .checklist li:first-child{ border-top:none; }

  .tag{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 3px 7px;
    border-radius: 5px;
    font-weight: bold;
    white-space: nowrap;
    margin-top: 2px;
  }

  .tag.rule{ background: var(--red-dark); color: #f0d0d0; }
  .tag.prompt{ background: #2f4d63; color: #cfe4f2; }
  .tag.game{ background: #3d5c2f; color: #d8ecc9; }
  .tag.show{ background: #5c4a2f; color: #ecdcc0; }

  .check-box{
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 6px;
    border: 2px solid var(--gold-dim);
    background: transparent;
    margin-top: 1px;
    position: relative;
  }

  .check-box.done{
    background: var(--gold);
    border-color: var(--gold);
  }

  .check-box.done::after{
    content: "✓";
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    color: #2a2119;
    font-size: 16px;
    font-weight: bold;
  }

  .item-text{
    flex:1;
    font-size: 15px;
    line-height: 1.4;
    padding-top: 3px;
    -webkit-user-select: text;
    user-select: text;
  }

  .item-text.done{
    text-decoration: line-through;
    color: var(--cream-dim);
  }

  .del-btn{
    background: transparent;
    border:none;
    color: var(--cream-dim);
    font-size: 20px;
    padding: 0 6px;
  }

  /* ===== SHOP SETUP (host-only panel) ===== */
  .shop-setup-row{
    display:flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  
  .shop-setup-row input{
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--cream);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    -webkit-user-select: text;
    user-select: text;
  }

  .shop-setup-row input.item-name{ flex: 2; }
  .shop-setup-row input.item-cost{ flex: 1; }

  .shop-status{
    font-size: 14px;
    color: var(--cream-dim);
    font-style: italic;
  }

  .go-shop-btn{
    font-family: Impact, Haettenschweiler, sans-serif;
    letter-spacing: 1px;
    font-size: 18px;
    padding: 12px 22px;
    border-radius: 8px;
    border: none;
    color: var(--cream);
    background: var(--gold-dim);
    border-bottom: 4px solid #6b5626;
    min-height: 48px;
  }

  .go-shop-btn:active{ transform: translateY(2px); border-bottom-width: 2px; }

  /* ===== SHOP PRESENTATION OVERLAY (shown to cast/audience) ===== */
  .shop-overlay{
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    gap: 30px;
  }

  .shop-overlay.hidden{ display: none; }

  .shop-close-btn{
    position: absolute;
    top: 18px;
    left: 18px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--cream-dim);
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 8px;
  }

  .shop-heading{
    font-family: Impact, Haettenschweiler, sans-serif;
    letter-spacing: 2px;   /* was 3px, slightly tightened for the bigger scale */
    font-size: 34px;    /* was 22px */
    color: var(--gold-dim);
    text-transform: uppercase;
  }

  .shop-timer-display{
    font-family: Impact, Haettenschweiler, sans-serif;
    font-size: 170px;   /* was 96px */
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--shadow);
    line-height: 1;
  }

  .shop-timer-display.warn{ color: #e0b84a; }
  .shop-timer-display.over{ color: #d97a7a; }

  .shop-timer-toggle{
    font-family: Impact, Haettenschweiler, sans-serif;
    font-size: 20px;
    padding: 14px 28px;
    border-radius: 10px;
    border: none;
    background: var(--green);
    color: var(--cream);
    border-bottom: 4px solid var(--green-dark);
  }

  .shop-timer-toggle:active{ transform: translateY(2px); border-bottom-width: 2px; }

  .shop-items{
    display:flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 900px;
  }

  .shop-item{
    flex:1;
    min-width: 260px;   /* was 220px */
    background: var(--panel);
    border: 4px solid var(--border);   /* was 3px */
    border-radius: 16px;
    padding: 40px 24px;   /* was 28px 18px */
    text-align: center;
  }

  .shop-item.purchased{
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold) inset;
    background: var(--panel-raised);
  }

  .shop-item-name{
    font-size: 38px;    /* was 22px */
    font-weight: bold;
    color: var(--cream);
    margin-bottom: 16px;
    line-height: 1.3;
  }

  .shop-item-cost{
    font-family: Impact, Haettenschweiler, sans-serif;
    font-size: 54px;    /* was 30px */
    color: var(--gold);
  }

  .shop-hint{
    font-size: 13px;
    color: var(--cream-dim);
    font-style: italic;
  }

  .reorder-btns{
    display:flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 1px;
  }

  .reorder-btn{
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--cream-dim);
    font-size: 13px;
    line-height: 1;
    width: 28px;
    height: 22px;
    border-radius: 4px;
    padding: 0;
  }

  .reorder-btn:disabled{
    opacity: 0.25;
  }

</style>
</head>
<body>

<header>
  <h1>HOUSE <span>RULES</span></h1>
</header>

<div class="timer-bar">
  <div class="timer-readout">
    <div class="timer-elapsed" id="timerElapsed">00:00</div>
    <div class="timer-remaining" id="timerRemaining">35:00 left</div>
  </div>
  <div class="timer-target">
    <span>Target (min)</span>
    <input type="number" id="targetMinutes" min="1" max="180" value="35" onchange="updateTarget()">
  </div>
  <div class="timer-buttons">
    <button class="timer-btn go" id="timerToggleBtn" onclick="toggleTimer()">Start Show</button>
    <button class="timer-reset-btn" onclick="confirmReset()">Reset show</button>
  </div>
</div>

<div class="scene-bar">
  <div class="scene-status">
    <div class="label" id="sceneLabel">No scene running</div>
    <div class="value" id="sceneValue">Scene 0</div>
  </div>
  <button class="scene-btn start" id="sceneToggleBtn" onclick="toggleScene()">Start Scene</button>
</div>

<div class="counters" id="counters"></div>

<div class="scene-log">
  <h2>Scene log</h2>
  <div id="sceneLog"><div class="empty-note">No scenes logged yet.</div></div>
</div>

<div class="notes-section">
  <h2>Upcoming rules &amp; prompts</h2>
  <div class="add-row">
    <select id="newItemType">
      <option value="rule">Rule</option>
      <option value="prompt">Prompt</option>
      <option value="game">Game</option>
      <option value="show">Show</option>
    </select>
    <input type="text" id="newItemText" placeholder="e.g. Everyone is called Greg">
    <button onclick="addItem()">Add</button>
    <button class="timer-reset-btn" onclick="confirmClearChecklist()">Clear list</button>
  </div>
  <ul class="checklist" id="checklist"></ul>
</div>

<div class="notes-section" style="margin-bottom:18px;">
  <h2>Shop</h2>
  <div id="shopSetupRows"></div>
  <div style="display:flex; align-items:center; gap:14px; margin-top:10px; flex-wrap:wrap;">
    <button class="go-shop-btn" onclick="openShop()">Go To Shop</button>
    <div class="shop-status" id="shopStatus">Last shop result: no purchase made</div>
  </div>
</div>

<div class="shop-overlay hidden" id="shopOverlay">
  <button class="shop-close-btn" onclick="closeShop()">✕ Close Shop</button>
  <div class="shop-heading">The Shop</div>
  <div class="shop-timer-display" id="shopTimerDisplay">01:30</div>
  <button class="shop-timer-toggle" id="shopTimerToggleBtn" onclick="toggleShopTimer()">Start Timer</button>
  <div class="shop-items" id="shopItemsDisplay"></div>
  <div class="shop-hint">Tap an item to mark it as purchased</div>
</div>

<script>
  const STORAGE_KEY = 'houseRulesState_v1';

  const defaultState = {
    contestants: [
      { name: 'Ben', score: 0 },
      { name: 'Emma T', score: 0 },
      { name: 'Luke', score: 0 },
      { name: 'Jack', score: 0 }
    ],
    sceneNumber: 0,
    sceneActive: false,
    sceneStartScores: null,
    sceneLog: [],
    checklist: [],
    shop: {
      items: [
        { name: "Soften 'No First Names' (once per scene)", cost: '-3 pts' },
        { name: "Remove 'No Eye Contact'", cost: '-5 pts' },
        { name: 'Mystery Option 🎁', cost: '+3 pts' }
      ],
      lastPurchaseIndex: null
    },
    timer: {
      running: false,
      elapsedMs: 0,
      startedAt: null,
      targetMinutes: 35
    }
  };

  let state = loadState();

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return JSON.parse(JSON.stringify(defaultState));
      const parsed = JSON.parse(raw);
      // basic shape safety
      if(!parsed.contestants || parsed.contestants.length !== 4) throw new Error('bad shape');
      // migrate older saved states that predate the timer feature
      if(!parsed.timer){
        parsed.timer = { running: false, elapsedMs: 0, startedAt: null, targetMinutes: 35 };
      }
      if(!parsed.shop){
        parsed.shop = {
          items: [
            { name: "Remove 'No First Names'", cost: '-7 pts' },
            { name: "Soften 'No Looking' (break once free)", cost: '-3 pts' },
            { name: 'Mystery Option', cost: '+5 pts' }
          ],
          lastPurchaseIndex: null
        };
      }
      return parsed;
    }catch(e){
      return JSON.parse(JSON.stringify(defaultState));
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      // storage full or unavailable — fail silently, show still runs in-memory
    }
  }

  function confirmReset(){
    if(confirm('Reset all scores, the timer and scene log? Your rules/prompts checklist and shop setup will be kept. This cannot be undone.')){
      stopTimerInterval();
      const keepChecklist = state.checklist;
      const keepShopItems = state.shop.items;
      state = JSON.parse(JSON.stringify(defaultState));
      state.checklist = keepChecklist;
      state.shop.items = keepShopItems;
      saveState();
      renderAll();
    }
  }

  // ===== COUNTERS =====
  function renderCounters(){
    const wrap = document.getElementById('counters');
    wrap.innerHTML = '';
    state.contestants.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'counter-card';
      card.id = 'card-' + i;

      let deltaHtml = '';
      if(state.sceneActive && state.sceneStartScores){
        const d = c.score - state.sceneStartScores[i];
        if(d !== 0){
          deltaHtml = (d > 0 ? '+' + d : d) + ' this scene';
        }
      }

      card.innerHTML = `
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="delta">${deltaHtml}</div>
        <div class="score ${c.score < 0 ? 'negative' : ''}" id="score-${i}">${c.score}</div>
        <div class="btn-row">
          <button class="pm-btn minus" onclick="adjustScore(${i}, -1)">−</button>
          <button class="pm-btn plus" onclick="adjustScore(${i}, 1)">+</button>
        </div>
      `;
      wrap.appendChild(card);
    });
  }

  function adjustScore(i, amount){
    state.contestants[i].score += amount;
    saveState();
    renderCounters();
    const card = document.getElementById('card-' + i);
    card.classList.remove('flash');
    void card.offsetWidth; // restart animation
    card.classList.add('flash');
  }

  // ===== SHOW TIMER =====
  let timerInterval = null;

  function getElapsedMs(){
    const t = state.timer;
    return t.running ? t.elapsedMs + (Date.now() - t.startedAt) : t.elapsedMs;
  }

  function toggleTimer(){
    const t = state.timer;
    if(!t.running){
      t.running = true;
      t.startedAt = Date.now();
      startTimerInterval();
    } else {
      t.elapsedMs = getElapsedMs();
      t.running = false;
      t.startedAt = null;
      stopTimerInterval();
    }
    saveState();
    renderTimerButton();
    renderTimer();
  }

  function startTimerInterval(){
    stopTimerInterval();
    timerInterval = setInterval(renderTimer, 1000);
  }

  function stopTimerInterval(){
    if(timerInterval){
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function updateTarget(){
    const input = document.getElementById('targetMinutes');
    let val = parseInt(input.value, 10);
    if(isNaN(val) || val < 1) val = 1;
    state.timer.targetMinutes = val;
    saveState();
    renderTimer();
  }

  function formatMs(ms){
    const totalSeconds = Math.floor(Math.abs(ms) / 1000);
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return (ms < 0 ? '-' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function renderTimer(){
    const elapsedMs = getElapsedMs();
    document.getElementById('timerElapsed').textContent = formatMs(elapsedMs);

    const targetMs = state.timer.targetMinutes * 60 * 1000;
    const remainingMs = targetMs - elapsedMs;
    const remainingEl = document.getElementById('timerRemaining');

    remainingEl.textContent = (remainingMs < 0 ? formatMs(remainingMs) + ' over' : formatMs(remainingMs) + ' left');
    remainingEl.className = 'timer-remaining';
    if(remainingMs < 0){
      remainingEl.classList.add('over');
    } else if(remainingMs < 5 * 60 * 1000){
      remainingEl.classList.add('warn');
    }
  }

  function renderTimerButton(){
    const btn = document.getElementById('timerToggleBtn');
    if(state.timer.running){
      btn.textContent = 'Pause';
      btn.className = 'timer-btn pause';
    } else {
      btn.textContent = state.timer.elapsedMs > 0 ? 'Resume Show' : 'Start Show';
      btn.className = 'timer-btn go';
    }
  }

  // ===== SCENE TRACKING =====
  function toggleScene(){
    if(!state.sceneActive){
      state.sceneActive = true;
      state.sceneNumber += 1;
      state.sceneStartScores = state.contestants.map(c => c.score);
    } else {
      // end scene — log it
      const changes = state.contestants.map((c, i) => c.score - state.sceneStartScores[i]);
      state.sceneLog.unshift({
        number: state.sceneNumber,
        changes: changes.map((d, i) => ({ name: state.contestants[i].name, delta: d }))
      });
      state.sceneActive = false;
      state.sceneStartScores = null;
    }
    saveState();
    renderScene();
    renderCounters();
    renderSceneLog();
  }

  function renderScene(){
    const label = document.getElementById('sceneLabel');
    const value = document.getElementById('sceneValue');
    const btn = document.getElementById('sceneToggleBtn');

    if(state.sceneActive){
      label.textContent = 'Scene in progress';
      value.textContent = 'Scene ' + state.sceneNumber;
      btn.textContent = 'End Scene';
      btn.className = 'scene-btn end';
    } else {
      label.textContent = state.sceneNumber === 0 ? 'No scene running' : 'Last: Scene ' + state.sceneNumber;
      value.textContent = 'Next: Scene ' + (state.sceneNumber + 1);
      btn.textContent = 'Start Scene';
      btn.className = 'scene-btn start';
    }
  }

  function renderSceneLog(){
    const wrap = document.getElementById('sceneLog');
    if(state.sceneLog.length === 0){
      wrap.innerHTML = '<div class="empty-note">No scenes logged yet.</div>';
      return;
    }
    wrap.innerHTML = state.sceneLog.map(entry => {
      const parts = entry.changes
        .filter(c => c.delta !== 0)
        .map(c => `${escapeHtml(c.name)} ${c.delta > 0 ? '+' + c.delta : c.delta}`)
        .join(', ');
      return `<div class="scene-log-entry"><b>Scene ${entry.number}:</b> ${parts || 'no change'}</div>`;
    }).join('');
  }

  // ===== SHOP SETUP (host-only editing) =====
  function renderShopSetup(){
    const wrap = document.getElementById('shopSetupRows');
    wrap.innerHTML = state.shop.items.map((item, i) => `
      <div class="shop-setup-row">
        <input class="item-name" type="text" value="${escapeHtml(item.name)}" placeholder="Item ${i+1} name" onchange="updateShopItem(${i}, 'name', this.value)">
        <input class="item-cost" type="text" value="${escapeHtml(item.cost)}" placeholder="Cost" onchange="updateShopItem(${i}, 'cost', this.value)">
      </div>
    `).join('');
  }

  function updateShopItem(idx, field, value){
    state.shop.items[idx][field] = value;
    saveState();
  }

  function renderShopStatus(){
    const el = document.getElementById('shopStatus');
    const idx = state.shop.lastPurchaseIndex;
    if(idx === null || idx === undefined){
      el.textContent = 'Last shop result: no purchase made';
    } else {
      const item = state.shop.items[idx];
      el.textContent = 'Last shop result: "' + item.name + '" purchased' + (item.cost ? ' (' + item.cost + ')' : '');
    }
  }

  // ===== SHOP PRESENTATION OVERLAY =====
  let shopTimer = { running: false, remainingMs: 60000, intervalId: null, lastTick: null };

  function openShop(){
    state.shop.lastPurchaseIndex = null;
    saveState();
    resetShopTimer();
    renderShopItems();
    document.getElementById('shopOverlay').classList.remove('hidden');
  }

  function closeShop(){
    stopShopTimerInterval();
    document.getElementById('shopOverlay').classList.add('hidden');
    saveState();
    renderShopStatus();
  }

  function resetShopTimer(){
    stopShopTimerInterval();
    shopTimer.running = false;
    shopTimer.remainingMs = 60000;
    renderShopTimerDisplay();
    document.getElementById('shopTimerToggleBtn').textContent = 'Start Timer';
  }

  function toggleShopTimer(){
    if(!shopTimer.running){
      shopTimer.running = true;
      shopTimer.lastTick = Date.now();
      shopTimer.intervalId = setInterval(tickShopTimer, 200);
      document.getElementById('shopTimerToggleBtn').textContent = 'Pause Timer';
    } else {
      shopTimer.running = false;
      stopShopTimerInterval();
      document.getElementById('shopTimerToggleBtn').textContent = 'Resume Timer';
    }
  }

  function stopShopTimerInterval(){
    if(shopTimer.intervalId){
      clearInterval(shopTimer.intervalId);
      shopTimer.intervalId = null;
    }
  }

  function tickShopTimer(){
    const now = Date.now();
    const delta = now - shopTimer.lastTick;
    shopTimer.lastTick = now;
    shopTimer.remainingMs -= delta;
    if(shopTimer.remainingMs <= 0){
      shopTimer.remainingMs = 0;
      shopTimer.running = false;
      stopShopTimerInterval();
      document.getElementById('shopTimerToggleBtn').textContent = 'Start Timer';
    }
    renderShopTimerDisplay();
  }

  function renderShopTimerDisplay(){
    const el = document.getElementById('shopTimerDisplay');
    el.textContent = formatMs(shopTimer.remainingMs);
    el.className = 'shop-timer-display';
    if(shopTimer.remainingMs <= 0){
      el.classList.add('over');
    } else if(shopTimer.remainingMs <= 15000){
      el.classList.add('warn');
    }
  }

  function selectShopItem(idx){
    state.shop.lastPurchaseIndex = (state.shop.lastPurchaseIndex === idx) ? null : idx;
    saveState();
    renderShopItems();
  }

  function renderShopItems(){
    const wrap = document.getElementById('shopItemsDisplay');
    wrap.innerHTML = state.shop.items.map((item, i) => `
      <div class="shop-item ${state.shop.lastPurchaseIndex === i ? 'purchased' : ''}" onclick="selectShopItem(${i})">
        <div class="shop-item-name">${escapeHtml(item.name || ('Item ' + (i+1)))}</div>
        <div class="shop-item-cost">${escapeHtml(item.cost || '')}</div>
      </div>
    `).join('');
  }

  // ===== CHECKLIST =====
  function addItem(){
    const input = document.getElementById('newItemText');
    const type = document.getElementById('newItemType').value;
    const text = input.value.trim();
    if(!text) return;
    state.checklist.push({ text, type, done: false });
    input.value = '';
    saveState();
    renderChecklist();
  }

  function toggleItem(idx){
    state.checklist[idx].done = !state.checklist[idx].done;
    saveState();
    renderChecklist();
  }

  function deleteItem(idx){
    state.checklist.splice(idx, 1);
    saveState();
    renderChecklist();
  }

  function moveItem(idx, direction){
    const newIdx = idx + direction;
    if(newIdx < 0 || newIdx >= state.checklist.length) return;
    const list = state.checklist;
    [list[idx], list[newIdx]] = [list[newIdx], list[idx]];
    saveState();
    renderChecklist();
  }

  function confirmClearChecklist(){
    if(confirm('Clear the entire rules/prompts checklist? This cannot be undone.')){
      state.checklist = [];
      saveState();
      renderChecklist();
    }
  }

  function renderChecklist(){
    const list = document.getElementById('checklist');
    if(state.checklist.length === 0){
      list.innerHTML = '<li class="empty-note" style="border-top:none; padding-left:4px;">Nothing queued yet — add a rule or prompt above.</li>';
      return;
    }
    list.innerHTML = state.checklist.map((item, i) => `
      <li>
        <div class="reorder-btns">
          <button class="reorder-btn" onclick="moveItem(${i}, -1)" ${i === 0 ? 'disabled' : ''} aria-label="Move up">▲</button>
          <button class="reorder-btn" onclick="moveItem(${i}, 1)" ${i === state.checklist.length - 1 ? 'disabled' : ''} aria-label="Move down">▼</button>
        </div>
        <button class="check-box ${item.done ? 'done' : ''}" onclick="toggleItem(${i})" aria-label="Mark done"></button>
        <span class="tag ${item.type}">${item.type}</span>
        <span class="item-text ${item.done ? 'done' : ''}">${escapeHtml(item.text)}</span>
        <button class="del-btn" onclick="deleteItem(${i})" aria-label="Delete">✕</button>
      </li>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // allow Enter key to add item
  document.getElementById('newItemText').addEventListener('keydown', function(e){
    if(e.key === 'Enter') addItem();
  });

  function renderAll(){
    renderCounters();
    renderScene();
    renderSceneLog();
    renderChecklist();
    renderShopSetup();
    renderShopStatus();
    document.getElementById('targetMinutes').value = state.timer.targetMinutes;
    renderTimerButton();
    renderTimer();
    if(state.timer.running){
      startTimerInterval();
    }
  }

  renderAll();
</script>

</body>
</html>
