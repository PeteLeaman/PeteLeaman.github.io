<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host Desk — Springfield Trivia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --yellow:#FBD130;
    --yellow-deep:#F4B400;
    --sky:#3A9BDC;
    --krusty:#E0393E;
    --ink:#0F1226;
    --cream:#FFFCF2;
    --panel:#171A33;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
  }
  header{
    background:linear-gradient(90deg, var(--sky), #1F6FA8);
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    border-bottom:5px solid var(--ink);
  }
  header h1{
    font-family:'Luckiest Guy',cursive;
    color:var(--yellow);
    -webkit-text-stroke:2px var(--ink);
    margin:0;
    font-size:clamp(1.4rem,3.4vw,2.1rem);
    letter-spacing:1px;
  }
  .room-tag{
    color:#eaf6ff;
    font-weight:700;
    font-size:.85rem;
    background:rgba(0,0,0,.25);
    padding:6px 12px;
    border-radius:20px;
  }

  main{
    max-width:1100px;
    margin:0 auto;
    padding:22px 18px 60px;
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
  }

  /* ---- buzzer status panel ---- */
  #buzzerPanel{
    background:var(--panel);
    color:#fff;
    border-radius:16px;
    padding:20px 22px;
    box-shadow:0 8px 0 rgba(0,0,0,.15);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  #winnerDisplay{
    font-family:'Luckiest Guy',cursive;
    font-size:clamp(1.6rem,4.4vw,2.6rem);
    letter-spacing:.5px;
    min-height:1.3em;
  }
  #winnerDisplay .waiting{color:#93a3c9;font-family:'Inter',system-ui,sans-serif;font-weight:700;font-size:1.05rem;}
  #winnerDisplay .win{color:var(--yellow);}
  #resetBtn{
    font-family:'Luckiest Guy',cursive;
    font-size:1.15rem;
    letter-spacing:.5px;
    color:var(--ink);
    background:var(--yellow);
    border:3px solid #000;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--yellow-deep);
    white-space:nowrap;
  }
  #resetBtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--yellow-deep);}

  @keyframes flashBg{
    0%,100%{background:var(--panel);}
    50%{background:#3a2f0d;}
  }
  #buzzerPanel.flashing{animation:flashBg .5s ease-in-out 3;}

  /* ---- tabs ---- */
  .tabbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .tabbtn{
    font-family:'Luckiest Guy',cursive;
    font-size:1rem;
    letter-spacing:.3px;
    background:#fff;
    color:var(--ink);
    border:3px solid var(--ink);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    padding:10px 18px;
    cursor:pointer;
    opacity:.6;
  }
  .tabbtn.active{
    opacity:1;
    background:var(--yellow);
  }

  .round{
    display:none;
    background:#fff;
    border:3px solid var(--ink);
    border-radius:0 12px 12px 12px;
    padding:18px 20px 8px;
  }
  .round.active{display:block;}
  .round h2{
    font-family:'Luckiest Guy',cursive;
    margin:0 0 4px;
    font-size:1.4rem;
    color:var(--sky);
    -webkit-text-stroke:1px var(--ink);
  }
  .round p.desc{margin:0 0 16px;color:#555;font-size:.92rem;}

  .qa{
    border-top:2px dashed #ddd;
    padding:14px 0;
  }
  .qa:first-of-type{border-top:none;}
  .qnum{
    display:inline-block;
    background:var(--krusty);
    color:#fff;
    font-weight:800;
    font-size:.78rem;
    padding:2px 8px;
    border-radius:6px;
    margin-right:8px;
  }
  .qtext{font-weight:700;font-size:1.02rem;}
  .revealBtn{
    margin-top:8px;
    font-weight:700;
    font-size:.85rem;
    background:var(--sky);
    color:#fff;
    border:none;
    border-radius:7px;
    padding:7px 14px;
    cursor:pointer;
  }
  .answer{
    margin-top:10px;
    background:#FFF6D8;
    border-left:5px solid var(--yellow-deep);
    padding:10px 14px;
    border-radius:0 8px 8px 0;
    font-weight:700;
    display:none;
  }
  .answer.shown{display:block;}

  details#roomBox{margin-top:4px;font-size:.85rem;color:#555;}
  #roomInput{padding:6px 10px;border-radius:6px;border:2px solid var(--ink);font-family:inherit;}
  #roomSaveBtn{margin-left:6px;padding:6px 12px;border-radius:6px;border:2px solid var(--ink);background:var(--yellow);font-weight:800;cursor:pointer;}
</style>
</head>
<body>

<header>
  <h1>📺 Host Desk — Springfield Trivia</h1>
  <div class="room-tag">Room: <span id="roomLabel"></span></div>
</header>

<main>
  <section id="buzzerPanel">
    <div id="winnerDisplay"><span class="waiting">Waiting for a buzz…</span></div>
    <button id="resetBtn">Reset Buzzers</button>
  </section>

  <details id="roomBox">
    <summary>Running a different room code?</summary>
    <div style="margin-top:8px;">
      <input id="roomInput" type="text" maxlength="24">
      <button id="roomSaveBtn">Save &amp; reload</button>
    </div>
  </details>

  <nav class="tabbar" id="tabbar"></nav>
  <div id="rounds"></div>
</main>

<script>
/* =========================================================
   FIREBASE SETUP — use the SAME config object as index.html.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCLOSO0PVEDIsPSvdC-ciKXD3vYpn7KjHw",
  authDomain: "simpsons-off.firebaseapp.com",
  databaseURL: "https://simpsons-off-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "simpsons-off",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const DEFAULT_ROOM = "simpsons-trivia";
let roomCode = localStorage.getItem("buzzerRoom") || DEFAULT_ROOM;
document.getElementById("roomLabel").textContent = roomCode;
document.getElementById("roomInput").value = roomCode;
let winnerRef = db.ref("rooms/" + roomCode + "/winner");

document.getElementById("roomSaveBtn").addEventListener("click", () => {
  const val = document.getElementById("roomInput").value.trim() || DEFAULT_ROOM;
  localStorage.setItem("buzzerRoom", val);
  location.reload();
});

/* ---- ding sound (synthesized, no external files) ---- */
let audioCtx;
function ctx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playDing(){
  const c = ctx();
  const t = c.currentTime;
  [880, 1320].forEach((freq, i) => {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, t + i*0.08);
    g.gain.linearRampToValueAtTime(0.22, t + i*0.08 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + i*0.08 + 0.5);
    o.connect(g).connect(c.destination);
    o.start(t + i*0.08); o.stop(t + i*0.08 + 0.5);
  });
}

/* ---- buzzer panel ---- */
const winnerDisplay = document.getElementById("winnerDisplay");
const buzzerPanel = document.getElementById("buzzerPanel");
const resetBtn = document.getElementById("resetBtn");

resetBtn.addEventListener("click", () => winnerRef.set(null));

winnerRef.on("value", snap => {
  const val = snap.val();
  if (val && val.name) {
    winnerDisplay.innerHTML = '<span class="win">🚨 ' + escapeHtml(val.name) + ' buzzed in!</span>';
    ctx();
    playDing();
    buzzerPanel.classList.remove("flashing");
    void buzzerPanel.offsetWidth; // restart animation
    buzzerPanel.classList.add("flashing");
  } else {
    winnerDisplay.innerHTML = '<span class="waiting">Waiting for a buzz…</span>';
    buzzerPanel.classList.remove("flashing");
  }
});

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* =========================================================
   TRIVIA CONTENT — edit freely, add/remove rounds & questions.
   ========================================================= */
const ROUNDS = [

      ["My eyes! The goggles do nothing!", "Rainer Wolfcastle"],

      ["Well, replace the word ‘kinda’ with the word ‘repeatedly’, and the word ‘dog’ with the word ‘son’", "Lionel  Hutz"],
      ["We don’t have bums in our town, Marge, and if we did they wouldn’t rush", "Hank Scorpio"],
      ["Aurora Borealis", "Principal Skinner"]
    ]
  },
  {
    title: "Picture Round",
    desc: "We are looking for both names where possible. A point per name (first or last).",
    questions: [
      ["1 - 65 episodes", "Raphael"],
      ["2", "Patty Bouvier"],
      ["3 - 16 episodes", "Lurleen Lumpkin"],
      ["4", "Agnes Skinner"],
      ["5 - 79 episodes", "Lindsey Naegle"],
      ["6", "Tim Lovejoy"],
      ["7 - 73 episodes", "Gil Gunderson"],
      ["8", "Patty Bouvier (Again!)"],
      ["9 - 4 episodes", "Laura Powers"],
      ["10", "Homer Simpson (as Krusty the Clown)"]
    ]
  },
  {
    title: "Familial Fortunates",
    desc: "",
    questions: [
      ["What would you buy Homer Simpson in a Secret Santa?", "Beer - 67. Donuts - 24. Bowling Ball - 5."],
      ["Name someone Bart would block on MySpace.", "Skinner - 34. Homer - 33. Nelson - 19. Lisa - 15."],
      ["Name a voice actor from The Simpsons.", "Hank Azaria - 42. Harry Shearer - 21. Nancy Cartwright - 18. Dan Castellaneta - 10. Matt Groening - 9."]
    ]
  },
  {
    title: "Harder Trivia",
    desc: "",
    questions: [
      ["When Homer uses a toaster to time travel, what creature does he kill which affects the future timeline?", "Mosquito"],
      ["What is the title of the episode featuring Hank Scorpio?", "You Only Move Twice"],
      ["In You Only Move Twice, what is the name of the town The Simpsons move to?", "Cypress Creek"],
      ["What is the name of the Australian boy that Bart prank calls?", "Tobias"],

  },
  {

    desc: "",
    questions: [
      ["Track 1", "Monorail"],

      ["Set B - We’re sending our love down the well", "Down that well!"],

      ["Set B - Canyonero ", "Canyonero"]
    ]
  },
  {
    title: "Bonus Dance Round!",
    desc: "First to buzz gets to dance! No stealing this round",
    questions: [
      ["I Am Evil Homer", ""],
      ["Old Gray Mare", ""],
      ["Fly Girl", ""],
      ["Stupid Sexy Flanders", ""]
    ]
  },
  {
    title: "The Mormon Newlyweds Game",
    desc: "You will both write on your paper your own answer and the answer that your opponent would answer - you get a point for guessing your opponent right.",
    questions: [
      ["Who is their favourite character?", ""],
      ["What is their favourite episode?", ""],
      ["If they could go to one Springville location, where would it be?", ""],
      ["Who is their favourite celebrity guest?", ""],
      ["Pete - Who is their favourite character?", "Hans Moleman"],
      ["Pete - What is their favourite episode?", "Behind The Laughter"],
      ["Pete - If they could go to one Springville location, where would it be?", "Jebediah Springfield's Cabin"],
      ["Pete - Who is their favourite celebrity guest?", "Xena - Lucy Lawless"]
    ]
  },
  {
    title: "Picture Round 2",
    desc: "",
    questions: [
      ["1", "$500"],
      ["2", "Cheese Puffs"],
      ["3", "Comic Book Guy"],
      ["4", "Libya"],
      ["5", "Manic Mailman"],
      ["6", "Melted Scepter"],
      ["7", "Fake Nose"]
    ]
  }
];

const tabbar = document.getElementById("tabbar");
const roundsEl = document.getElementById("rounds");

ROUNDS.forEach((round, ri) => {
  const btn = document.createElement("button");
  btn.className = "tabbtn" + (ri === 0 ? " active" : "");
  btn.textContent = "Round " + (ri + 1);
  btn.addEventListener("click", () => selectRound(ri));
  tabbar.appendChild(btn);

  const sec = document.createElement("section");
  sec.className = "round" + (ri === 0 ? " active" : "");
  sec.id = "round-" + ri;

  const h2 = document.createElement("h2");
  h2.textContent = "Round " + (ri + 1) + ": " + round.title;
  sec.appendChild(h2);

  const p = document.createElement("p");
  p.className = "desc";
  p.textContent = round.desc;
  sec.appendChild(p);

  round.questions.forEach((qa, qi) => {
    const div = document.createElement("div");
    div.className = "qa";
    div.innerHTML =
      '<span class="qnum">Q' + (qi + 1) + '</span><span class="qtext"></span>' +
      '<div><button class="revealBtn">Show Answer</button></div>' +
      '<div class="answer"></div>';
    div.querySelector(".qtext").textContent = qa[0];
    div.querySelector(".answer").textContent = qa[1];
    const revealBtn = div.querySelector(".revealBtn");
    const answerEl = div.querySelector(".answer");
    revealBtn.addEventListener("click", () => {
      answerEl.classList.toggle("shown");
      revealBtn.textContent = answerEl.classList.contains("shown") ? "Hide Answer" : "Show Answer";
    });
    sec.appendChild(div);
  });

  roundsEl.appendChild(sec);
});

function selectRound(idx){
  document.querySelectorAll(".tabbtn").forEach((b, i) => b.classList.toggle("active", i === idx));
  document.querySelectorAll(".round").forEach((r, i) => r.classList.toggle("active", i === idx));
}
</script>
</body>
</html>
